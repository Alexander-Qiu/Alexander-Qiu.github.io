name: Daily automated commit

on:
  schedule:
    # 01:23 UTC = 09:23 Asia/Shanghai.
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-automated-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master

      - name: Record today's automated activity
        shell: bash
        run: |
          set -euo pipefail
          today="$(date +%F)"
          printf '{\n  "date": "%s",\n  "timezone": "Asia/Shanghai",\n  "automated": true\n}\n' "$today" > .github/daily-activity.json
          git add .github/daily-activity.json
          if git diff --cached --quiet; then
            echo "Today's automated activity is already recorded."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --author="Alexander-Qiu <68356670+Alexander-Qiu@users.noreply.github.com>" \
              -m "chore: record automated daily activity for $today"
          git push origin HEAD:master
